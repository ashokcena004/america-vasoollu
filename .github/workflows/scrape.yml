name: Hourly Fandango Scraper

on:
  # push:
  #   branches:
  #     - master
  # schedule:
  #   - cron: '45 * * * *' # Runs at minute 45 every hour
  workflow_dispatch: # Allows you to manually trigger it via GitHub UI

permissions:
  contents: read # Changed from write since we no longer commit/push files!

concurrency:
  group: fandango-global
  cancel-in-progress: false

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Fandango Scraper
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FIREBASE_DATABASE_URL: https://wkndcinema-default-rtdb.asia-southeast1.firebasedatabase.app
          INR_TO_USD: ${{ secrets.INR_TO_USD }}
          OVERWRITE_SNAPSHOT: "false"
          PLAYWRIGHT_BROWSER_TRACKING: "1"
          FANDANGO_QUEUE_ENABLED: "true"
        run: |
          python fandango_noblockv4.py

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fandango-reports-${{ github.run_id }}
          path: |
            reports/*.xlsx
            reports/*.html
            reports/*.png
          if-no-files-found: warn
          retention-days: 30